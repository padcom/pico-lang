name: Homebrew llvm@23 (macOS)
description: >-
  Installs Homebrew's llvm@23 (keg-only; scripts/env.sh finds it under $(brew --prefix)/opt).
  Homebrew has no bottles for Intel Macs, so there llvm@23 and its dependencies compile from
  source, more than 5 h of the 6 h a job may take (#127); their kegs are cached instead
  (llvm.sh). Apple silicon installs the bottle, as before, uncached.

runs:
  using: composite
  steps:
    - name: The cache key (Intel)
      id: plan
      if: runner.arch == 'X64'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/llvm.sh" plan'

    - uses: actions/cache/restore@v4
      id: restore
      if: runner.arch == 'X64'
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.plan.outputs.key }}

    # Restored kegs: linked by brew and checked; nothing is built here. If they don't make a
    # working LLVM, it's a warning and the build below runs.
    - name: Use the cached llvm@23 (Intel)
      id: use
      if: runner.arch == 'X64' && steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: |
        if "$GITHUB_ACTION_PATH/llvm.sh" link; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi

    - name: Install llvm@23 (Apple silicon)
      if: runner.arch != 'X64'
      shell: bash
      run: |
        # (An image's Homebrew index can predate llvm@23, as the Intel one's did.)
        brew install llvm@23 || { brew update && brew install llvm@23; }

    - name: Build llvm@23 (Intel)
      if: runner.arch == 'X64' && steps.use.outputs.ok != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/llvm.sh" build'

    # The key and paths again, from the kegs actually built (an index update may have moved a
    # version); it fails unless they make a working LLVM. Only caches saved on main are visible
    # to tag runs, so .github/workflows/macos-llvm-cache.yml fills it from main.
    - name: The built kegs (Intel)
      id: built
      if: runner.arch == 'X64' && steps.use.outputs.ok != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/llvm.sh" built'

    - uses: actions/cache/save@v4
      if: runner.arch == 'X64' && steps.use.outputs.ok != 'true'
      with:
        path: ${{ steps.built.outputs.paths }}
        key: ${{ steps.built.outputs.key }}
