# THROWAWAY (#129, removed before merge): solves scripts/conda/llvm-osx-64.in on an Intel Mac
# and prints the lock file, which the release build installs from.
name: conda llvm lock (throwaway)

on:
  push:
    branches: [fix/129-conda-llvm]
    paths: ['scripts/conda/**', 'scripts/ci-llvm-conda.sh', '.github/workflows/conda-llvm-lock.yml']

jobs:
  lock:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - shell: bash -eo pipefail {0}
        run: scripts/ci-llvm-conda.sh --relock "$RUNNER_TEMP/llvm" | tee llvm-osx-64.lock
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-osx-64.lock
          path: llvm-osx-64.lock
