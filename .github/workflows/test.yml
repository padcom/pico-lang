name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every Linux job installs the same packages and shares one Rust cache (saved by `test` only),
# so the golden runs for other targets start in parallel with `scripts/test.sh` instead of
# after it.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23 (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@23

      - name: Install LLVM 23 (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-install-linux.sh

      # The wasm32-browser glue tests run under Node.js (Wasm exception handling).
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}

      # `pico dap`'s attach test attaches lldb to a process it didn't start, which Ubuntu's Yama
      # default (ptrace_scope 1) forbids.
      - name: Allow attaching debuggers (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: scripts/test.sh
        run: scripts/test.sh

  # The golden suite's native runs for other targets: linux-x64 under qemu-user, musl,
  # wasm32-wasi under wasmtime and wasm32-browser under Node.js (through the glue).
  golden:
    name: golden (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64-musl, wasm32-wasi, wasm32-browser]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23
        run: scripts/ci-install-linux.sh

      # The version the development VM uses (docs/DEVELOPMENT.md).
      - name: Install wasmtime
        if: matrix.target == 'wasm32-wasi'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=v50.0.1
          gh release download $v --repo bytecodealliance/wasmtime \
            --pattern "wasmtime-$v-aarch64-linux.tar.xz" --dir /tmp
          gh attestation verify /tmp/wasmtime-$v-aarch64-linux.tar.xz --repo bytecodealliance/wasmtime
          tar -xJf /tmp/wasmtime-$v-aarch64-linux.tar.xz -C /tmp
          echo /tmp/wasmtime-$v-aarch64-linux >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        if: matrix.target == 'wasm32-browser'
        with:
          node-version: 26

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: Linux
          save-if: false

      - name: Golden tests for ${{ matrix.target }}
        run: |
          source scripts/env.sh
          PICO_TEST_TARGET=${{ matrix.target }} cargo test --quiet -p pico-tests --test golden

      # The WasmGC backend (P8.7): what it can't compile yet is pending.
      - name: Golden tests on the WasmGC backend
        if: matrix.target == 'wasm32-browser'
        run: |
          source scripts/env.sh
          PICO_BACKEND=wasmgc PICO_TEST_TARGET=wasm32-browser cargo test --quiet -p pico-tests --test golden

  # macOS programs built on Linux (P8.4: lld and the bundled libSystem.tbd), run on a Mac.
  macos-build:
    name: macos-build (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, macos-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23
        run: scripts/ci-install-linux.sh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: Linux
          save-if: false

      - name: Build the golden tests for ${{ matrix.target }}
        run: |
          source scripts/env.sh
          PICO_TEST_TARGET=${{ matrix.target }} PICO_TEST_EXPORT=$PWD/golden-${{ matrix.target }} \
            cargo test --quiet -p pico-tests --test golden -- export

      - uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.target }}
          path: golden-${{ matrix.target }}
          retention-days: 3

  macos:
    name: macos (${{ matrix.target }})
    needs: macos-build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, macos-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Rosetta (for x86-64 programs)
        if: matrix.target == 'macos-x64'
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - uses: actions/download-artifact@v4
        with:
          name: golden-${{ matrix.target }}
          path: golden-${{ matrix.target }}

      - name: Run the golden tests
        run: |
          chmod +x golden-${{ matrix.target }}/* || true
          cargo run --quiet --release -p pico-golden-run -- golden-${{ matrix.target }}

  # Windows programs are built on Linux and run on Windows (decision 248).
  windows-build:
    name: windows-build (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x64, windows-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23
        run: scripts/ci-install-linux.sh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: Linux
          save-if: false

      - name: Build the golden tests for ${{ matrix.target }}
        run: |
          source scripts/env.sh
          PICO_TEST_TARGET=${{ matrix.target }} PICO_TEST_EXPORT=$PWD/golden-${{ matrix.target }} \
            cargo test --quiet -p pico-tests --test golden -- export

      - uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.target }}
          path: golden-${{ matrix.target }}
          retention-days: 3

  windows:
    name: windows (${{ matrix.target }})
    needs: windows-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: actions/download-artifact@v4
        with:
          name: golden-${{ matrix.target }}
          path: golden-${{ matrix.target }}

      # The process fixtures run POSIX tools (`cat`, `echo`, `sleep`, `wc`): Git's. Appended,
      # so Git's `link.exe` can't shadow MSVC's while cargo builds the runner.
      - name: Run the golden tests
        run: |
          $tools = "C:\Program Files\Git\usr\bin"
          if (-not (Test-Path "$tools\cat.exe")) { throw "no POSIX tools at $tools" }
          $env:PATH = "$env:PATH;$tools"
          cargo run --quiet --release -p pico-golden-run -- golden-${{ matrix.target }}
