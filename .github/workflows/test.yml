name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23 (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@23

      - name: Install LLVM 23 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23-dev libpolly-23-dev libzstd-dev zlib1g-dev liblld-23-dev \
            libc6-amd64-cross qemu-user-static

      - uses: Swatinem/rust-cache@v2

      - name: scripts/test.sh
        run: scripts/test.sh

      - name: Golden tests for linux-x64 under qemu-user
        if: runner.os == 'Linux'
        run: |
          source scripts/env.sh
          PPL_TEST_TARGET=linux-x64 cargo test --quiet -p ppl-tests --test golden

      - name: Golden tests for linux-arm64-musl
        if: runner.os == 'Linux'
        run: |
          source scripts/env.sh
          PPL_TEST_TARGET=linux-arm64-musl cargo test --quiet -p ppl-tests --test golden

      # Windows programs are built here and run on Windows below (decision 248).
      - name: Build Windows golden tests
        if: runner.os == 'Linux'
        run: |
          source scripts/env.sh
          for t in windows-x64 windows-arm64; do
            PPL_TEST_TARGET=$t PPL_TEST_EXPORT=$PWD/golden-$t \
              cargo test --quiet -p ppl-tests --test golden -- export
          done

      - name: Upload Windows golden tests
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: golden-windows
          path: golden-windows-*
          retention-days: 3

  windows:
    name: windows (${{ matrix.target }})
    needs: test
    # Only the Linux leg of `test` builds the programs: a macOS failure shouldn't skip these.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: actions/download-artifact@v4
        with:
          name: golden-windows

      - name: Run the golden tests
        run: cargo run --quiet --release -p ppl-golden-run -- golden-${{ matrix.target }}
