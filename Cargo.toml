[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
pico-diag = { path = "crates/pico-diag" }
pico-syntax = { path = "crates/pico-syntax" }
pico-sema = { path = "crates/pico-sema" }
pico-mir = { path = "crates/pico-mir" }
pico-interp = { path = "crates/pico-interp" }
pico-codegen = { path = "crates/pico-codegen" }
pico-runtime = { path = "crates/pico-runtime" }
pico-driver = { path = "crates/pico-driver" }
pico-lsp = { path = "crates/pico-lsp" }
pico-lint = { path = "crates/pico-lint" }
pico-lld = { path = "crates/pico-lld" }
pico-clang = { path = "crates/pico-clang" }
pico-tests = { path = "crates/pico-tests" }
clap = { version = "4.6", features = ["derive"] }
cc = "1.2"
inkwell = { version = "0.11", features = ["llvm23-1"] }
insta = "1.49"
unicode-ident = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
