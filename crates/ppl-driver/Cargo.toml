[package]
name = "ppl-driver"
description = "Compilation pipeline, caching, targets and linking for ppl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ppl-codegen.workspace = true
ppl-diag.workspace = true
ppl-interp.workspace = true
ppl-lld.workspace = true
ppl-mir.workspace = true
ppl-runtime.workspace = true
ppl-sema.workspace = true
ppl-syntax.workspace = true
# Making WASI programs preview 2 components (decision 257).
wit-component = "0.263"
wit-parser = "0.263"
# Reading clang's JSON AST of C headers (`c:` imports, decision 262).
# (`preserve_order`: `ppl add`/`remove` keep a manifest's key order.)
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
ppl-lld.workspace = true
insta.workspace = true

[lints]
workspace = true
