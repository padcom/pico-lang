[package]
name = "pico-cli"
description = "The pico command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pico"
path = "src/main.rs"

[features]
# A self-contained `pico`: the runtime, vendored C sources and stdlib inside (decision 297).
embed = ["pico-runtime/embed"]

[dependencies]
clap.workspace = true
pico-runtime.workspace = true
pico-clang.workspace = true
pico-diag.workspace = true
pico-codegen.workspace = true
pico-driver.workspace = true
pico-lint.workspace = true
pico-lsp.workspace = true
pico-mir.workspace = true
pico-sema.workspace = true
pico-syntax.workspace = true
serde_json = "1"
addr2line = { version = "0.27", features = ["loader"] }
object = "0.40"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[lints]
workspace = true
