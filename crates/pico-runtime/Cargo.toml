[package]
name = "pico-runtime"
description = "Builds and locates the pico C runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[features]
# Bundle the resources into the compiler (release builds; decision 297).
embed = ["dep:flate2"]

[dependencies]
flate2 = { version = "1.1", optional = true }

[build-dependencies]
cc.workspace = true
flate2 = { version = "1.1", optional = true }

[dev-dependencies]
pico-interp.workspace = true

[lints]
workspace = true
